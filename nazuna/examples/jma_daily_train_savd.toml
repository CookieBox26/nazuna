out_dir = "./out/jma_daily_train_savd"
exist_ok = true

# =============== data ===============
[data]
path = [ "jma", "weather_japan_daily_2025-01-01_2025-12-31_2_blocks.csv",]
colname_timestamp = "date"
seq_len = 28
pred_len = 7
white_list = [ "temp_avg_nagoya", "temp_avg_fukuoka",]

# =============== definitions ===============
[definitions.MAE]
cls_path = "nazuna.criteria.MAE"
params = { n_channel = 2, pred_len = 7 }

[definitions.ImprovementRate]
cls_path = "nazuna.criteria.ImprovementRate"
params = { n_channel = 2, pred_len = 7, error_type = "mae" }

[definitions.SimpleAverage]
cls_path = "nazuna.models.simple_average.SimpleAverage"
params = { seq_len = 28, pred_len = 7, period_len = 7 }

[definitions.SimpleAverageVariableDecay]
cls_path = "nazuna.models.simple_average.SimpleAverageVariableDecay"
params = { seq_len = 28, pred_len = 7, period_len = 7 }

[definitions.BatchSamplerShuffle]
cls_path = "nazuna.batch_sampler.BatchSamplerShuffle"
params = { batch_size = 32 }

# =============== tasks ===============
[[tasks]]
task_type = "eval"
name = "Eval SimpleAverage"
data_range_eval = [ 0.8, 1.0,]
criterion = "MAE"
model = "SimpleAverage"

[[tasks]]
task_type = "train"
name = "Pilot SimpleAverageVariableDecay"
data_range_train = [ 0.0, 0.6,]
data_range_eval = [ 0.6, 0.8,]
criterion = "MAE"
model = "SimpleAverageVariableDecay"
batch_sampler = "BatchSamplerShuffle"
n_epoch = 20
early_stop = true
[tasks.optimizer]
cls_path = "torch.optim.Adam"
params = { lr = 0.01 }
[tasks.lr_scheduler]
cls_path = "torch.optim.lr_scheduler.CosineAnnealingLR"
params = { T_max = 20 }

[[tasks]]
task_type = "train"
name = "Train SimpleAverageVariableDecay"
data_range_train = [ 0.0, 0.8,]
criterion = "MAE"
model = "SimpleAverageVariableDecay"
batch_sampler = "BatchSamplerShuffle"
n_epoch = { task_name = "Pilot SimpleAverageVariableDecay" }
[tasks.optimizer]
cls_path = "torch.optim.Adam"
params = { lr = 0.01 }
[tasks.lr_scheduler]
cls_path = "torch.optim.lr_scheduler.CosineAnnealingLR"
params = { T_max = 20 }

[[tasks]]
task_type = "eval"
name = "Eval SimpleAverageVariableDecay"
data_range_eval = [ 0.8, 1.0,]
criterion = "MAE"
model = "SimpleAverageVariableDecay"
model_state = { task_name = "Train SimpleAverageVariableDecay" }

[[tasks]]
task_type = "eval"
name = "Eval SimpleAverageVariableDecay (ImprovementRate)"
data_range_eval = [ 0.8, 1.0,]
criterion = "ImprovementRate"
baseline_model = "SimpleAverage"
model = "SimpleAverageVariableDecay"
model_state = { task_name = "Train SimpleAverageVariableDecay" }
