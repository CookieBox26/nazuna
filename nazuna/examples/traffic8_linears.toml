out_dir = "./out/traffic8_linears"
exist_ok = true

# =============== data ===============
data = "Traffic8"

# =============== definitions ===============
definition_includes = [
{ bundled = "common" },
{ bundled = "datasets" },
{ bundled = "dlinear" },
]

[definition_includes_data]
n_channel = 8
seq_len_sample = 1344
pred_len_sample = 168
seq_len_raw = 672
pred_len = 168
period_len = 168

[definitions]
NEpoch = 50
Cyclic = { base = "Last4Cycles" }

[definitions.Model]
base = "NLinear"

[definitions.Model01]
base = "Model"
[definitions.Model01.params]
subtract_last = false
use_revin = true

[definitions.Model02]
base = "Model"
[definitions.Model02.params]
subtract_last = false
use_revin = true
revin_affine = true

# =============== template ===============
[template]
template_type = "train_with_baseline_multiparams"
criterion_eval = "MAE"
criterion_target = "MAE"
criterion_imprate = "ImprovementRate"
baseline_model = "Cyclic"
model = ""
data_range_eval = "DataRangeEval"
data_range_train = "DataRangeTrain"
data_range_eval_pilot = "DataRangeEvalPilot"
data_range_train_pilot = "DataRangeTrainPilot"
batch_sampler = "BSS128"
optimizer = "Adam00003"
lr_scheduler = "ExponentialLR09"
n_epoch = "NEpoch"
patience = 10

[[template.params]]
seed = 0
model = "Model"
criterion_target = "MAE"

[[template.params]]
seed = 0
model = "Model01"
criterion_target = "MAE"

[[template.params]]
seed = 0
model = "Model02"
criterion_target = "MAE"
