out_dir = "./out/jma_hourly_3m_eval_naive"
exist_ok = true

# =============== data ===============
[data]
path = [ "jma", "weather_japan_hourly_2025-09-01_2025-12-31_27_blocks.csv",]
colname_timestamp = "timestamp"
seq_len = 97  # 24 * 4 + 1
pred_len = 24

# =============== definitions ===============
[definitions.MAE]
cls_path = "nazuna.criteria.MAE"
params = { n_channel = 27, pred_len = 24 }

[definitions.SimpleAverage]
cls_path = "nazuna.models.simple_average.SimpleAverage"
params = { seq_len = 96, pred_len = 24, period_len = 24 }

[definitions.SimpleDiffAverage]
cls_path = "nazuna.models.simple_average.SimpleDiffAverage"
params = { seq_len = 97, pred_len = 24, period_len = 24 }

# =============== tasks ===============
[[tasks]]
task_type = "eval"
name = "Eval SimpleAverage"
data_range_eval = [ 0.8, 1.0,]
criterion = "MAE"
model = "SimpleAverage"

[[tasks]]
task_type = "eval"
name = "Eval SimpleDiffAverage"
data_range_eval = [ 0.8, 1.0,]
criterion = "MAE"
model = "SimpleDiffAverage"
