out_dir = "./out/jma_daily_train_dlinearc_inspect"
exist_ok = true

# =============== data ===============
[data]
path = [ "jma", "weather_japan_daily_2025-01-01_2025-12-31_2_blocks.csv",]
colname_timestamp = "date"
seq_len = 29
pred_len = 7
white_list = [ "temp_avg_nagoya", "temp_avg_fukuoka",]

# =============== definitions ===============
[definitions.MAE]
cls_path = "nazuna.criteria.MAE"
params = { n_channel = 2, pred_len = 7 }

[definitions.DLinearChannelwise]
cls_path = "nazuna.models.dlinear.DLinearChannelwise"
[definitions.DLinearChannelwise.params]
seq_len = 29
pred_len = 7
kernel_size = 25
n_channel = 2
bias = true
quantile_mode_train = "full"
quantile_mode_eval = "saved"

# =============== tasks ===============
[[tasks]]
task_type = "eval"
name = "Eval ini"
data_range_eval = [ 0.6, 0.8,]
criterion = "MAE"
model = "DLinearChannelwise"
model_state_path = "./out/jma_daily_train_dlinearc/pilot_dlinearchannelwise/model_state_ini.pth"
inspector_params = { delta_scale = 0.001 }

