out_dir = "./out/jma_daily_train_dlinear"
exist_ok = true

# =============== data ===============
[data]
path = [ "jma", "weather_japan_daily_2025-01-01_2025-12-31_2_blocks.csv",]
colname_timestamp = "date"
seq_len = 29
pred_len = 7
white_list = [ "temp_avg_nagoya", "temp_avg_fukuoka",]

# =============== definitions ===============
[definitions.MAE]
cls_path = "nazuna.criteria.MAE"
params = { n_channel = 2, pred_len = 7 }

[definitions.ImprovementRate]
cls_path = "nazuna.criteria.ImprovementRate"
params = { n_channel = 2, pred_len = 7, error_type = "mae" }

[definitions.SimpleDiffAverage]
cls_path = "nazuna.models.simple_average.SimpleDiffAverage"
params = { seq_len = 29, pred_len = 7, period_len = 7 }

[definitions.DLinear]
cls_path = "nazuna.models.dlinear.DLinear"
[definitions.DLinear.params]
seq_len = 29
pred_len = 7
kernel_size = 25
bias = true
quantile_mode_train = "full"
quantile_mode_eval = "saved"

[definitions.BatchSamplerShuffle]
cls_path = "nazuna.batch_sampler.BatchSamplerShuffle"
params = { batch_size = 32 }

# =============== tasks ===============
[[tasks]]
task_type = "eval"
name = "Eval SimpleDiffAverage"
data_range_eval = [ 0.8, 1.0,]
criterion = "MAE"
model = "SimpleDiffAverage"

[[tasks]]
task_type = "train"
name = "Pilot DLinear"
data_range_train = [ 0.0, 0.6,]
data_range_eval = [ 0.6, 0.8,]
criterion = "MAE"
model = "DLinear"
batch_sampler = "BatchSamplerShuffle"
inspector_params = { delta_scale = 0.001 }
n_epoch = 20
early_stop = true
[tasks.optimizer]
cls_path = "torch.optim.Adam"
params = { lr = 0.001 }
[tasks.lr_scheduler]
cls_path = "torch.optim.lr_scheduler.CosineAnnealingLR"
params = { T_max = 20 }

[[tasks]]
task_type = "train"
name = "Train DLinear"
data_range_train = [ 0.0, 0.8,]
criterion = "MAE"
model = "DLinear"
batch_sampler = "BatchSamplerShuffle"
n_epoch = { task_name = "Pilot DLinear" }
[tasks.optimizer]
cls_path = "torch.optim.Adam"
params = { lr = 0.001 }
[tasks.lr_scheduler]
cls_path = "torch.optim.lr_scheduler.CosineAnnealingLR"
params = { T_max = 20 }

[[tasks]]
task_type = "eval"
name = "Eval DLinear"
data_range_eval = [ 0.8, 1.0,]
criterion = "MAE"
model = "DLinear"
model_state = { task_name = "Train DLinear" }

[[tasks]]
task_type = "eval"
name = "Eval DLinear (ImprovementRate)"
data_range_eval = [ 0.8, 1.0,]
criterion = "ImprovementRate"
baseline_model = "SimpleDiffAverage"
model = "DLinear"
model_state = { task_name = "Train DLinear" }
