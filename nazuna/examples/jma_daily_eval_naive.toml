out_dir = "./out/jma_daily_eval_naive"
exist_ok = true

# =============== data ===============
[data]
path = [ "jma", "weather_japan_daily_2025-01-01_2025-12-31_2_blocks.csv",]
colname_timestamp = "date"
seq_len = 29
pred_len = 7
white_list = [ "temp_avg_nagoya", "temp_avg_fukuoka",]

# =============== definitions ===============
[definitions.MAE]
cls_path = "nazuna.criteria.MAE"
params = { n_channel = 2, pred_len = 7 }

[definitions.SimpleAverage]
cls_path = "nazuna.models.simple_average.SimpleAverage"
params = { seq_len = 28, pred_len = 7, period_len = 7 }

[definitions.SimpleDiffAverage]
cls_path = "nazuna.models.simple_average.SimpleDiffAverage"
params = { seq_len = 29, pred_len = 7, period_len = 7 }

[definitions.Circular]
cls_path = "nazuna.models.circular.Circular"
[definitions.Circular.params]
seq_len = 29
pred_len = 7
n_channel = 2
periods = [ 1, 2, 7, 14, 28,]
quantile_mode_train = "full"
quantile_mode_eval = "saved"

[definitions.BatchSamplerShuffle]
cls_path = "nazuna.batch_sampler.BatchSamplerShuffle"
params = { batch_size = 16 }

# =============== tasks ===============
[[tasks]]
task_type = "eval"
name = "Eval SimpleAverage"
data_range_eval = [ 0.8, 1.0,]
criterion = "MAE"
model = "SimpleAverage"

[[tasks]]
task_type = "eval"
name = "Eval SimpleDiffAverage"
data_range_eval = [ 0.8, 1.0,]
criterion = "MAE"
model = "SimpleDiffAverage"

[[tasks]]
task_type = "train"
name = "Train Circular"
data_range_train = [ 0.0, 0.8,]
data_range_eval = [ 0.8, 1.0,]
criterion = "MAE"
model = "Circular"
batch_sampler = "BatchSamplerShuffle"
n_epoch = 5
[tasks.optimizer]
cls_path = "torch.optim.Adam"
params = { lr = 0.001 }
[tasks.lr_scheduler]
cls_path = "torch.optim.lr_scheduler.CosineAnnealingLR"
params = { T_max = 5 }

[[tasks]]
task_type = "eval"
name = "Eval Circular"
data_range_eval = [ 0.8, 1.0,]
criterion = "MAE"
model = "Circular"
model_state = { task_name = "Train Circular" }
