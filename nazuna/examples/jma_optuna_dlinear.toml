out_dir = "./out/jma_optuna_dlinear"
exist_ok = true

# =============== data ===============
[data]
path = [ "jma", "weather_japan_hourly_2025-09-01_2025-12-31_27_blocks.csv",]
colname_timestamp = "timestamp"
seq_len = 97  # 24 * 4 + 1
pred_len = 24
white_list = "temp_fukuoka,temp_osaka,temp_tokyo,temp_sendai"

# =============== definitions ===============
[definitions.MSE]
cls_path = "nazuna.criteria.MSE"
params = { n_channel = 4, pred_len = 24 }

[definitions.DLinear]
cls_path = "nazuna.models.dlinear.DLinear"
[definitions.DLinear.params]
seq_len = 97
pred_len = 24
kernel_size = 25
bias = true
scaler_cls_path = "nazuna.models.common.IqrScaler"
scaler_params = { "stat_types" = [ "qtile_full", "saved",] }

[definitions.BatchSamplerShuffle]
cls_path = "nazuna.batch_samplers.BatchSamplerShuffle"
params = { batch_size = 16 }

[definitions.Adam]
cls_path = "torch.optim.Adam"
params = { lr = 0.001 }

# =============== tasks ===============
[[tasks]]
task_type = "optuna"
name = "Optuna 0"
load_if_exists = false
n_trials = 3
n_epoch = 3
criterion = "MSE"
model = "DLinear"
batch_sampler = "BatchSamplerShuffle"
optimizer = "Adam"
data_ranges_with_train_seeds = [
  { train = [ 0.0, 0.2,], eval = [ 0.2, 0.3,], seed = 0 },
  { train = [ 0.1, 0.3,], eval = [ 0.3, 0.4,], seed = 1 },
]

[tasks.search_space.model_params]
kernel_size = { method = "index", type = "int", choices = "15,25,35" }

[tasks.search_space.optimizer_params]
lr = { method = "log_uniform", range = ["0.0001", "0.1",] }
