out_dir = "./out/ecl8_baselines"
exist_ok = true

# =============== data ===============
data = "ECL8"

# =============== definitions ===============
definition_includes = [
{ bundled = "common" },
{ bundled = "datasets" },
]

[definition_includes_data]
n_channel = 8
seq_len_sample = 1344
pred_len_sample = 168
seq_len_raw = 672
pred_len = 168
period_len = 168

